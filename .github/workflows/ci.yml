name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Typecheck unit build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      ENABLE_ADMIN: 'false'
      ENABLE_PUBLIC_GALLERY: 'false'
      ENABLE_BOOKING_API: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Current site unit tests
        run: npm run test:site
        env:
          NEXT_PUBLIC_BASE_URL: https://lanasweet.heysmart.lv
      - name: Reusable feature unit tests
        run: npm run test:reusable
      - name: Build
        run: npm run build
      - name: Upload Next build
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Playwright smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      ENABLE_ADMIN: 'false'
      ENABLE_PUBLIC_GALLERY: 'false'
      ENABLE_BOOKING_API: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Download Next build
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke
        run: npm run test:e2e
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results
          path: test-results
          retention-days: 7
